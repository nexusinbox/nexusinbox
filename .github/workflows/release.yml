# Release the computer-side programs (docs/32): on a version tag in the
# public repository, build `nexusinbox` with the signer and gateway for
# macOS and Linux, attest where each archive was built, and publish them as
# a GitHub Release that the Homebrew tap points at.
#
# Each build uploads its own archive to a draft release, so no artifact
# actions are needed; the draft is published once every build is in.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  draft:
    # Releases come from the public repository only.
    if: github.repository == 'nexusinbox/nexusinbox'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft \
            --title "NexusInbox ${TAG#v}" \
            --notes "Computer-side programs for NexusInbox: \`nexusinbox\` with the signer daemon and the gateway.

          Install on a Mac: \`brew install nexusinbox/tap/nexusinbox\`, then \`nexusinbox connect <code>\` with the code the web app shows.

          Each archive has a SHA-256 file and a build provenance attestation:
          \`gh attestation verify <archive> --repo $GITHUB_REPOSITORY\`"

  build:
    needs: draft
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: macos-15, target: aarch64-apple-darwin }
          - { os: macos-15, target: x86_64-apple-darwin }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      # No token left in .git/config for dependency build scripts to find.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --target "${{ matrix.target }}"
          rustup default stable
      - name: Build and pack
        env:
          TAG: ${{ github.ref_name }}
        run: sh scripts/package_release.sh "${TAG#v}" "${{ matrix.target }}"
      - name: Attest where the archive was built
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
      - name: Upload to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" dist/*.tar.gz dist/*.tar.gz.sha256 --repo "$GITHUB_REPOSITORY"

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
