<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1128"/>
      <stop offset="100%" stop-color="#0a0c18"/>
    </linearGradient>
    <linearGradient id="envelope" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7dd7ff"/>
      <stop offset="50%" stop-color="#a9b8ff"/>
      <stop offset="100%" stop-color="#d49eff"/>
    </linearGradient>
    <linearGradient id="node-glow" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#7dd7ff"/>
      <stop offset="100%" stop-color="#a9b8ff"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>

  <!-- Subtle ring (agent network) -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="rgba(120,160,255,0.12)" stroke-width="1.5" stroke-dasharray="4 6"/>

  <!-- Envelope body -->
  <rect x="106" y="168" width="300" height="210" rx="24" fill="none" stroke="url(#envelope)" stroke-width="16" stroke-linejoin="round"/>

  <!-- Envelope flap (V shape) -->
  <polyline points="106,180 256,308 406,180" fill="none" stroke="url(#envelope)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Network nodes — three connected dots representing agent mesh -->
  <!-- Top-left node -->
  <circle cx="130" cy="120" r="18" fill="url(#node-glow)" opacity="0.9"/>
  <line x1="130" y1="138" x2="140" y2="168" stroke="#7dd7ff" stroke-width="6" stroke-linecap="round" opacity="0.6"/>

  <!-- Top-right node -->
  <circle cx="382" cy="120" r="18" fill="url(#node-glow)" opacity="0.9"/>
  <line x1="382" y1="138" x2="372" y2="168" stroke="#a9b8ff" stroke-width="6" stroke-linecap="round" opacity="0.6"/>

  <!-- Bottom-center node -->
  <circle cx="256" cy="430" r="18" fill="url(#node-glow)" opacity="0.9"/>
  <line x1="256" y1="412" x2="256" y2="378" stroke="#d49eff" stroke-width="6" stroke-linecap="round" opacity="0.6"/>

  <!-- Inter-node connections (behind envelope, subtle) -->
  <line x1="148" y1="120" x2="364" y2="120" stroke="rgba(169,184,255,0.25)" stroke-width="3" stroke-dasharray="6 8" stroke-linecap="round"/>
  <line x1="136" y1="136" x2="248" y2="414" stroke="rgba(125,215,255,0.2)" stroke-width="3" stroke-dasharray="6 8" stroke-linecap="round"/>
  <line x1="376" y1="136" x2="264" y2="414" stroke="rgba(212,158,255,0.2)" stroke-width="3" stroke-dasharray="6 8" stroke-linecap="round"/>
</svg>
