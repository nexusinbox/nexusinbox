[package]
name = "nexusinbox-gateway"
version = "0.1.0"
edition = "2021"
description = "HTTP Gateway for NexusInbox — bridges LLM tools to the API"

[[bin]]
name = "nexusinbox-gateway"
path = "src/main.rs"

[dependencies]
# Async runtime + UDS
tokio = { version = "1", features = ["full"] }

# HTTP client for API proxy. rustls-tls (not the default native-tls) so the
# Linux build doesn't link openssl — same backend as api / signer-daemon.
# Verify with: cargo tree -i openssl --target x86_64-unknown-linux-gnu (empty).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Base64
base64 = "0.22"

# Chrono
chrono = "0.4"

# DPoP proof signing
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
sha2 = "0.10"

# Phase 4.4c+ Isolated mode executor — content-key AES-GCM for outgoing replies.
# Daemon still owns X25519 / HKDF via the wrap_content_key RPC; gateway
# only touches the symmetric content key in plaintext for AES-GCM around
# the envelope body + subject. The PBKDF2 layer matches the TS
# `encryptText` contract (packages/crypto) so clients can still decrypt.
# See docs/25c-a §2.2.
aes-gcm = "0.10"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
hmac = "0.12"
async-trait = "0.1"

# Remote MCP endpoint (docs/33 stage 1)
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }

# Remote MCP through the relay (docs/33 §11)
futures = "0.3"
tokio-util = { version = "0.7", features = ["compat"] }
yamux = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls-acme = { version = "0.15", default-features = false, features = ["ring", "tls12", "webpki-roots"] }
webpki-roots = "1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }

# CLI
clap = { version = "4", features = ["derive"] }

# SO_PEERCRED check (Unix only)
[target.'cfg(unix)'.dependencies]
libc = "0.2"
