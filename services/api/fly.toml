# fly.toml app configuration file generated for nexusinbox-api on 2026-04-18T11:08:55+09:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'nexusinbox-api'
primary_region = 'nrt'

[build]
  dockerfile = 'Dockerfile'

[env]
  AGENT_INBOX_COOKIE_SECURE = 'true'
  AGENT_INBOX_DATABASE_REQUIRED = 'true'
  AGENT_INBOX_WORLD_VERIFY_ENABLED = 'true'
  LOG_FORMAT = 'json'
  NODE_ENV = 'production'
  PORT = '8080'
  RUST_LOG = 'info'

[http_service]
  internal_port = 8080
  force_https = true
  # Keep one machine always warm so the first hit after an idle
  # period doesn't pay a 7s+ cold-boot tax (image pull + Rust
  # binary start + DB pool warm-up + sqlx::migrate! check). Extra
  # machines spawned by autoscale can still auto_stop when idle —
  # only the floor of 1 is held.
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '10s'
    grace_period = '60s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
  cpus = 1
  memory_mb = 512
  processes = ['app']
